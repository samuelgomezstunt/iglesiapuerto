<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - Redirigiendo...</title>
    <meta http-equiv="refresh" content="2; url=/iglesiapuerto/">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8fafc; color: #1e293b; text-align: center; }
        .card { background: white; padding: 2.5rem; border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); max-width: 480px; }
        h1 { font-size: 3rem; margin: 0 0 1rem; color: #0284c7; }
        p { font-size: 1.1rem; line-height: 1.6; margin-bottom: 1.5rem; }
        a { display: inline-block; background: #0284c7; color: white; padding: 0.75rem 1.5rem; border-radius: 0.5rem; text-decoration: none; font-weight: 600; }
        a:hover { background: #0369a1; }
    </style>

<!-- Nav Menu & Dropdown Robust Styles & Behavior -->
<style id="nav-menu-custom-styles">
/* Ensure desktop sub-menu displays on hover and focus */
@media (min-width: 1025px) {
  .elementor-nav-menu--main li.menu-item-has-children {
    position: relative !important;
  }
  .elementor-nav-menu--main li.menu-item-has-children:hover > ul.sub-menu,
  .elementor-nav-menu--main li.menu-item-has-children:focus-within > ul.sub-menu,
  .elementor-nav-menu--main li.menu-item-has-children > a:hover + ul.sub-menu,
  .elementor-nav-menu--main li.menu-item-has-children > ul.sub-menu:hover {
    display: block !important;
    opacity: 1 !important;
    visibility: visible !important;
    pointer-events: auto !important;
    position: absolute !important;
    top: 100% !important;
    left: 0 !important;
    z-index: 99999 !important;
    background-color: #FFFFFF !important;
    min-width: 200px !important;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12) !important;
    border-radius: 6px !important;
    padding: 8px 0 !important;
    list-style: none !important;
    margin: 0 !important;
  }
  .elementor-nav-menu--main li.menu-item-has-children > ul.sub-menu li {
    display: block !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  .elementor-nav-menu--main li.menu-item-has-children > ul.sub-menu li a {
    display: block !important;
    padding: 10px 20px !important;
    color: #1e293b !important;
    font-size: 14px !important;
    text-decoration: none !important;
    transition: background-color 0.2s ease, color 0.2s ease !important;
    white-space: nowrap !important;
  }
  .elementor-nav-menu--main li.menu-item-has-children > ul.sub-menu li a:hover,
  .elementor-nav-menu--main li.menu-item-has-children > ul.sub-menu li a.elementor-item-active {
    background-color: #f1f5f9 !important;
    color: #0284c7 !important;
  }
}
/* Mobile menu and toggle styles */
.elementor-menu-toggle {
  cursor: pointer !important;
  z-index: 99999 !important;
  position: relative !important;
}
.elementor-menu-toggle.elementor-active .elementor-menu-toggle__icon--open {
  display: none !important;
}
.elementor-menu-toggle.elementor-active .elementor-menu-toggle__icon--close {
  display: block !important;
}
.elementor-menu-toggle:not(.elementor-active) .elementor-menu-toggle__icon--open {
  display: block !important;
}
.elementor-menu-toggle:not(.elementor-active) .elementor-menu-toggle__icon--close {
  display: none !important;
}
@media (max-width: 1024px) {
  .elementor-nav-menu--dropdown.is-open {
    display: block !important;
    max-height: 1000vh !important;
    opacity: 1 !important;
    visibility: visible !important;
    transform: scaleY(1) !important;
    background-color: #ffffff !important;
    box-shadow: 0 12px 30px rgba(0,0,0,0.15) !important;
    border-radius: 0 0 12px 12px !important;
    padding: 10px 0 !important;
  }
  .elementor-nav-menu--dropdown li.menu-item-has-children > ul.sub-menu.is-open {
    display: block !important;
    opacity: 1 !important;
    visibility: visible !important;
    padding-left: 15px !important;
  }
  .elementor-nav-menu--dropdown .elementor-sub-item {
    font-size: 15px !important;
    padding: 8px 20px !important;
  }
}
</style>

</head>
<body>
    <div class="card">
        <h1>404</h1>
        <h2>Página no encontrada</h2>
        <p>El contenido que buscas no está disponible. Te estamos redirigiendo a la página principal de la Iglesia.</p>
        <a href="/iglesiapuerto/">Ir a Inicio</a>
    </div>

<script id="nav-menu-fix-js">
(function() {
  function setupNavMenu(widget) {
    var toggle = widget.querySelector('.elementor-menu-toggle');
    var dropdown = widget.querySelector('.elementor-nav-menu__container.elementor-nav-menu--dropdown');
    if (!toggle || !dropdown) return;
    
    if (!toggle._cleanFixed) {
      var newToggle = toggle.cloneNode(true);
      newToggle._cleanFixed = true;
      toggle.parentNode.replaceChild(newToggle, toggle);
      toggle = newToggle;

      function closeMenu() {
        toggle.classList.remove('elementor-active');
        toggle.setAttribute('aria-expanded', 'false');
        dropdown.setAttribute('aria-hidden', 'true');
        dropdown.classList.remove('is-open');
      }

      function openMenu() {
        toggle.classList.add('elementor-active');
        toggle.setAttribute('aria-expanded', 'true');
        dropdown.setAttribute('aria-hidden', 'false');
        dropdown.classList.add('is-open');
      }

      toggle.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        var isCurrentlyActive = toggle.classList.contains('elementor-active');
        if (isCurrentlyActive) {
          closeMenu();
        } else {
          openMenu();
        }
      }, true);

      document.addEventListener('click', function(e) {
        if (!widget.contains(e.target)) {
          closeMenu();
        }
      });

      dropdown.querySelectorAll('a:not(.elementor-item-anchor)').forEach(function(link) {
        link.addEventListener('click', function() {
          if (window.innerWidth <= 1024) {
            closeMenu();
          }
        });
      });
    }

    widget.querySelectorAll('li.menu-item-has-children > a').forEach(function(anchor) {
      if (!anchor._hasSubFix) {
        anchor._hasSubFix = true;
        anchor.addEventListener('click', function(e) {
          var subMenu = anchor.parentElement.querySelector('ul.sub-menu');
          if (subMenu) {
            if (window.innerWidth <= 1024 || anchor.getAttribute('href') === '#' || anchor.getAttribute('href') === '') {
              e.preventDefault();
              e.stopPropagation();
              var isOpen = subMenu.classList.toggle('is-open');
              subMenu.style.display = isOpen ? 'block' : 'none';
            }
          }
        });
      }
    });
  }

  function initNavMenuEnhancements() {
    document.querySelectorAll('.elementor-widget-nav-menu').forEach(setupNavMenu);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initNavMenuEnhancements);
  } else {
    initNavMenuEnhancements();
  }
  window.addEventListener('load', initNavMenuEnhancements);
})();
</script>

</body>
</html>
